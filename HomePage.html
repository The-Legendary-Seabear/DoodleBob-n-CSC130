 <button id="authorize_button" onclick="handleAuthClick()">
    Connect Google Drive
</button>

<pre id="content"></pre>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js"></script>

<script>
    const CLIENT_ID = '47132304169-o76d09ul4qmcuh9cif655snd8of8tl1u.apps.googleusercontent.com';

    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;

    function gapiLoaded() {
        gapi.load('client', initializeGapiClient);
    }

    async function initializeGapiClient() {
        await gapi.client.init({
            discoveryDocs: [
                'https://www.googleapis.com/discovery/v1/apis/drive/v3/rest'
            ]
        });
    }

    function gisLoaded() {
        tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: CLIENT_ID,
            scope: SCOPES,

            callback: async (response) => {
                if (response.error) {
                    console.error(response);
                    return;
                }

                console.log("Successfully connected to Google Drive!");

                await listFiles();
            }
        });
    }

    function handleAuthClick() {
        tokenClient.requestAccessToken({
            prompt: 'consent'
        });
    }

    async function listFiles() {

        const response = await gapi.client.drive.files.list({
            pageSize: 20,
            fields: 'files(id, name, mimeType)'
        });

        const files = response.result.files;

        console.log(files);

        const content = document.getElementById('content');

        if (!files || files.length === 0) {
            content.innerText = 'No files found in Google Drive.';
            return;
        }

        let output = 'Files in your Google Drive:\n\n';

        files.forEach(file => {
            output += file.name + '\n';
        });

        content.innerText = output;
    }

    window.onload = () => {
        gapiLoaded();
        gisLoaded();
    };
</script>
