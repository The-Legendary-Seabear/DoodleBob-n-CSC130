<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>My Playlists</title>

        <link rel="icon" href="../Images/Site Icon/favicon.ico" sizes="any">
        <link rel="icon" type="image/svg+xml" href="../Images/Site Icon/favicon.svg">
        <link rel="stylesheet" href="../styles.css">
        <link rel="stylesheet" href="../Main.css">
    </head>
    
    <body>
        <header>
            <h1>My Music</h1>
        </header>

        <main class="music-container">

            <!-- Songs / Selected Playlist -->
            <section class="songs-section">

                <h2 id="selectedPlaylistName">
                    Select a Playlist
                </h2>

                <button id="playPlaylistButton" type="button" disabled>
                    Play Playlist
                </button>

                <ul id="songList">
                    <!-- JavaScript will put songs here -->
                </ul>

                <button id="addSongButton">
                    + Add Song
                </button>

            </section>


            <!-- Playlists -->
            <aside class="playlists-section">

                <div class="playlist-header">
                    <h2>Playlists</h2>

                    <button id="createPlaylistButton">
                        + New Playlist
                    </button>
                </div>

                <ul id="playlistList">
                    <!-- JavaScript will put playlists here -->
                </ul>

            </aside>
        </main>
        <dialog id="addSongDialog">
            <form id="addSongForm" method="dialog">
                <h2>Add Song</h2>
                <label for="songToAdd">Choose a song</label>
                <select id="songToAdd" name="songToAdd" required>
                    <option value="">Select a song</option>
                </select>
                <p id="addSongError" role="alert"></p>
                <div class="dialog-actions">
                    <button type="button" id="cancelAddSongButton" class="btn-secondary">Cancel</button>
                    <button type="submit">Add Song</button>
                </div>
            </form>
        </dialog>
        <script src="../Functionality/libraryStorage.js"></script>
        <script src="Playlists.js"></script>
    </body>
</html>
