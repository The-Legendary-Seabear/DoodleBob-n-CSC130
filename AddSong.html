<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="HTML page for adding songs">
        <meta name="author" content="Cody Owens">

        <link rel="stylesheet" href="Main.css">
    </head>

    <form id="addSongForm">
        <div class="form-group">
            <label for="songName">Song Name:</label>
            <input type="text" id="songName" name="songName" required>
            <span id="songNameError" class="error"></span>
        </div>

        <div class="form-group">
            <label for="songFile">Song File:</label>
            <input type="file" id="songFile" name="songFile" accept="audio/*">
            <span id="songFileError" class="error"></span>
        </div>

        <button type="submit">Add Song to Library</button>
    </form>

    <script src="AddSong.js"></script>
</html>
