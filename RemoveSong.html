<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="description" content="HTML page for removing songs">
        <meta name="author" content="Cody Owens">

        <link rel="stylesheet" href="Main.css">
        <title>Remove Song</title>
    </head>

    <body>
        <a href="HomePage.html" class="home-button">Home</a>
        <h1>Remove Song</h1>

        <form id="removeSongForm">
            <div class="form-group">
                <label for="songName">Select Song:</label>
                <select id="songName" name="songName"></select>
                <span id="songNameError" class="error"></span>
            </div>

            <button type="submit">Remove Song from Library</button>
        </form>

        <div id="playlistNotice" class="info" style="margin-top:12px;color:green;"></div>

        <h2 style="margin-top:16px;">Stored Local Files</h2>
        <div id="localFilesList" style="margin-top:8px;"></div>

        <script src="idbStorage.js"></script>
        <script src="RemoveSong.js"></script>
    </body>
</html>
