<head>
  <title>Play Song</title>
  <link rel="icon" href="../../Images/Site Icon/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="../../Images/Site Icon/favicon.svg">
  <link rel="stylesheet" href="../../Main.css">
  <style>
    .hero-art {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 2rem;
    }
  </style>
</head>

<body>
  <div class="hero-art">
    <div class="player-card">
      <div class="player-header">
        <span class="track-title">Epic Gammer Music</span>
        <span class="track-time">0:00</span>
      </div>
      <div class="progress-bar"><span></span></div>
      <div class="controls">
        <button data-action="rewind">◄◄</button>
        <button data-action="play-pause">►</button>
        <button data-action="forward">►►</button>
      </div>
      <div class="song-picker">
        <label for="song-select">Choose a song</label>
        <select id="song-select"></select>
      </div>
    </div>
  </div>

  <audio id="audio-player" src="../../Test Files/EPIC_GAMMER_MUSIC.mp3"></audio>

  <script>
    const audio = document.getElementById('audio-player');
    const songSelect = document.getElementById('song-select');
    const playPauseButton = document.querySelector('button[data-action="play-pause"]');
    const rewindButton = document.querySelector('button[data-action="rewind"]');
    const forwardButton = document.querySelector('button[data-action="forward"]');
    const progressBar = document.querySelector('.progress-bar');
    const progressFill = progressBar.querySelector('span');
    const trackTime = document.querySelector('.track-time');
    const trackTitle = document.querySelector('.track-title');

    const defaultSong = { name: 'Epic Gammer Music', location: '../../Test Files/EPIC_GAMMER_MUSIC.mp3' };
    let songs = [defaultSong];

    function formatTime(seconds) {
      const minutes = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${minutes}:${secs.toString().padStart(2, '0')}`;
    }

    function updateProgress() {
      if (!audio.duration) return;
      const percent = (audio.currentTime / audio.duration) * 100;
      progressFill.style.width = `${percent}%`;
      trackTime.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
    }

    function setSong(song) {
      audio.src = song.location;
      trackTitle.textContent = song.name;
      audio.load();
      playPauseButton.textContent = '►';
      if (!audio.paused) {
        audio.play();
        playPauseButton.textContent = '❚❚';
      }
    }

    function populateSongSelect() {
      songSelect.innerHTML = '';
      songs.forEach((song, index) => {
        const option = document.createElement('option');
        option.value = song.location;
        option.textContent = song.name;
        option.dataset.name = song.name;
        if (song.location === defaultSong.location && index === 0) {
          option.selected = true;
        }
        songSelect.appendChild(option);
      });
    }

    function loadLibrarySongs() {
      const storedSongs = localStorage.getItem('librarySongs');
      if (!storedSongs) return;
      try {
        const parsed = JSON.parse(storedSongs);
        if (Array.isArray(parsed)) {
          parsed.forEach(song => {
            if (song && song.name && song.location) {
              songs.push({ name: song.name, location: song.location });
            }
          });
        }
      } catch (error) {
        console.warn('Could not load saved songs:', error);
      }
    }

    audio.addEventListener('loadedmetadata', () => {
      trackTime.textContent = `0:00 / ${formatTime(audio.duration)}`;
      updateProgress();
    });

    audio.addEventListener('timeupdate', updateProgress);

    audio.addEventListener('ended', () => {
      playPauseButton.textContent = '►';
    });

    playPauseButton.addEventListener('click', () => {
      if (audio.paused) {
        audio.play();
        playPauseButton.textContent = '❚❚';
      } else {
        audio.pause();
        playPauseButton.textContent = '►';
      }
    });

    rewindButton.addEventListener('click', () => {
      audio.currentTime = Math.max(0, audio.currentTime - 10);
    });

    forwardButton.addEventListener('click', () => {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
    });

    progressBar.addEventListener('click', event => {
      const rect = progressBar.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const ratio = clickX / rect.width;
      if (audio.duration) {
        audio.currentTime = ratio * audio.duration;
      }
    });

    songSelect.addEventListener('change', () => {
      const selectedOption = songSelect.selectedOptions[0];
      const song = {
        name: selectedOption.dataset.name || selectedOption.textContent,
        location: selectedOption.value
      };
      setSong(song);
    });

    loadLibrarySongs();
    populateSongSelect();
  </script>
</body>
